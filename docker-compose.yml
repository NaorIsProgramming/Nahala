# Dev only. Production compose is a later task: it pins an exact image
# and publishes no database port.
#
# postgres:18 stores the cluster at PGDATA=/var/lib/postgresql/18/docker
# and declares VOLUME /var/lib/postgresql. A mount at
# /var/lib/postgresql/data does not persist this image's data.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      NAHALA_APP_PASSWORD: ${NAHALA_APP_PASSWORD:?NAHALA_APP_PASSWORD is required}
      NAHALA_MIGRATOR_PASSWORD: ${NAHALA_MIGRATOR_PASSWORD:?NAHALA_MIGRATOR_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nahala-pg-data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  nahala-pg-data:
